name: Build Alamount RPA (Windows)

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Tesseract OCR + Turkish language data
        run: |
          choco install tesseract -y --no-progress
          $t = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$t\tesseract.exe")) { throw "Tesseract not installed" }
          foreach ($l in "tur", "eng", "osd") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata" -OutFile "$t\tessdata\$l.traineddata"
          }
          & "$t\tesseract.exe" --list-langs

      - name: Build exe (PyInstaller onedir)
        run: pyinstaller --noconfirm --clean AlamountRPA.spec

      - name: Assemble package
        run: |
          $p = "paket"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item -Recurse dist\AlamountRPA\* $p\
          foreach ($d in "input","input\ise_giris","output","archive","error","logs") {
            New-Item -ItemType Directory -Force "$p\$d" | Out-Null
            New-Item -ItemType File -Force "$p\$d\.gitkeep" | Out-Null
          }
          Copy-Item config.ini, KULLANIM.md, calistir.bat, izleme_modu.bat, gorev_zamanlayici_kur.bat, gorev_zamanlayici_kaldir.bat, merkez_kur.bat, ajan_kur.bat, merkez_ajan_kaldir.bat $p\
          Copy-Item -Recurse gorevler $p\gorevler
          Copy-Item -Recurse marka $p\marka
          Copy-Item -Recurse ornek_veri $p\ornek_veri
          # Tesseract (taşınabilir): yalnızca çalışma için gerekli dosyalar
          $t = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force "$p\tesseract\tessdata" | Out-Null
          Copy-Item "$t\*.exe", "$t\*.dll" "$p\tesseract\" -Exclude "*training*", "unicharset_extractor.exe", "wordlist2dawg.exe", "uninstall.exe"
          Copy-Item "$t\tessdata\tur.traineddata", "$t\tessdata\eng.traineddata", "$t\tessdata\osd.traineddata" "$p\tesseract\tessdata\"
          if (Test-Path "$t\tessdata\configs") { Copy-Item -Recurse "$t\tessdata\configs" "$p\tesseract\tessdata\configs" }
          Copy-Item "$t\*.txt", "$t\*.md" "$p\tesseract\" -ErrorAction SilentlyContinue
          "{0:N0} MB" -f ((Get-ChildItem $p -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Compress-Archive -Path "$p\*" -DestinationPath AlamountRPA_Windows.zip -Force

      - name: Smoke test - setup check, PCA, OCR onboarding, Mikro dry run
        run: |
          # Paket kopyasında test et; PATH'teki Tesseract'ı gizle ki paketteki kullanılsın
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Tesseract' }) -join ';'
          Expand-Archive AlamountRPA_Windows.zip -DestinationPath smoke -Force
          Set-Location smoke
          (Get-Content config.ini) -replace '^dosya_bekleme_sn = .*', 'dosya_bekleme_sn = 0' | Set-Content -Encoding utf8 config.ini
          function Run([string[]]$a) { & .\AlamountRPA.exe @a; if ($LASTEXITCODE -ne 0) { throw "AlamountRPA $a failed ($LASTEXITCODE)" } }
          Run kontrol
          Copy-Item ornek_veri\data2.txt input\
          Run pca, --once
          Copy-Item ornek_veri\ise_giris\* input\ise_giris\
          Run ise-giris
          $x = Get-ChildItem output\ise_giris -Recurse -Filter "*.xlsx"
          if ($x.Count -lt 2) { throw "Expected 2 onboarding Excel files" }
          Run robot, mikro_personel_giris, --variable, KURU_CALISMA:evet
          Run robot, ornek_efatura_mutabakat
          foreach ($x in "faturalar.xlsx", "mutabakat.xlsx") { if (-not (Test-Path "output\$x")) { throw "$x üretilmedi" } }
          foreach ($g in (Get-ChildItem gorevler\*.robot).BaseName) { Run robot, $g, --dryrun }

      - name: Smoke test - Notepad desktop automation (RPA.Windows)
        continue-on-error: true
        working-directory: smoke
        run: |
          .\AlamountRPA.exe robot ornek_masaustu_notepad
          if ($LASTEXITCODE -ne 0) { throw "notepad robot failed" }
          Get-Content output\notepad_ornek.txt

      - name: Smoke test - browser automation (RPA.Browser.Selenium)
        continue-on-error: true
        working-directory: smoke
        run: |
          .\AlamountRPA.exe robot ornek_tarayici
          if ($LASTEXITCODE -ne 0) { throw "browser robot failed" }

      - name: Smoke test - Citrix/RDP görüntü otomasyonu (şablon + OCR, UI Automation yok)
        continue-on-error: true
        working-directory: smoke
        run: |
          .\AlamountRPA.exe robot ornek_citrix_goruntu
          if ($LASTEXITCODE -ne 0) { throw "görüntü otomasyonu robotu başarısız" }
          Get-Content output\citrix_demo_sonuc.json

      - name: Smoke test - TCMB canlı kur (dış servis)
        continue-on-error: true
        working-directory: smoke
        run: |
          @'
          *** Settings ***
          Library    AlamountBaglayicilar
          *** Tasks ***
          TCMB Kuru
              ${usd}=    Kur Al    USD
              Should Be True    ${usd} > 1
              ${pazar}=    Kur Al    EUR    2026-10-18
              Log    USD ${usd} / EUR (18.10.2026 → önceki iş günü) ${pazar}    console=True
          '@ | Set-Content -Encoding utf8 gorevler\ci_tcmb.robot
          .\AlamountRPA.exe robot ci_tcmb
          if ($LASTEXITCODE -ne 0) { throw "TCMB kuru alınamadı" }

      - name: Smoke test - gözetimsiz oturum (otomatik oturum açma, LSA, görevler, gözetmen)
        working-directory: smoke
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $p = "Ac1!" + [guid]::NewGuid().ToString("N").Substring(0, 10)   # net user: en fazla 14 karakter
          net user ci_robot $p /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Test kullanıcısı oluşturulamadı" }
          function Durum { $o = (& .\AlamountRPA.exe oturum-durum) -join "`n"; $o; return $o }
          # yanlış parola: hiçbir şey değişmemeli (runner imajında zaten runneradmin için autologon açık olabilir)
          $wlYol = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          $once = Get-ItemProperty $wlYol
          $y = (& .\AlamountRPA.exe oturum-kur --kullanici .\ci_robot --parola yanlis-parola) -join "`n"
          if ($LASTEXITCODE -eq 0 -or $y -notmatch 'parola yanlış') { throw "Yanlış parola reddedilmedi: $y" }
          $sonra = Get-ItemProperty $wlYol
          if ($sonra.DefaultUserName -ne $once.DefaultUserName -or $sonra.AutoAdminLogon -ne $once.AutoAdminLogon) { throw "Yanlış parolayla Winlogon değişti" }
          & .\AlamountRPA.exe oturum-kur --kullanici .\ci_robot --parola $p
          if ($LASTEXITCODE -ne 0) { throw "oturum-kur başarısız" }
          $wl = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"
          if ($wl.AutoAdminLogon -ne "1" -or $wl.DefaultUserName -ne "ci_robot" -or $wl.ForceAutoLogon -ne "1") { throw "Winlogon ayarları hatalı" }
          if ($wl.PSObject.Properties.Name -contains "DefaultPassword") { throw "Kayıt defterinde düz metin parola var" }
          $d = Durum
          foreach ($m in 'Otomatik oturum açma: AÇIK', 'LSA parola: True', 'Görev AlamountRPA_Ajan: var', 'Görev AlamountRPA_OturumGozetmeni: var') {
            if ($d -notmatch [regex]::Escape($m)) { throw "oturum-durum: '$m' yok" }
          }
          $x = [xml](schtasks /Query /TN AlamountRPA_Ajan /XML | Out-String)
          if ($x.Task.Principals.Principal.LogonType -ne "InteractiveToken" -or $x.Task.Triggers.LogonTrigger.UserId -notmatch 'ci_robot$|^S-1-5-21-') { throw "Ajan görevi hatalı: $($x.OuterXml)" }
          if ((Get-Content config.ini -Raw) -notmatch '(?m)^mod = autologon') { throw "config [OTURUM] yazılmadı" }
          & .\AlamountRPA.exe oturum-gozetmen --tek-sefer
          if ($LASTEXITCODE -ne 0) { throw "gözetmen başarısız" }
          if ((Get-Content logs\*.log | Out-String) -notmatch 'Robot oturumu yok') { throw "gözetmen kararı loglanmadı" }
          & .\AlamountRPA.exe oturum-kaldir
          $d = Durum
          foreach ($m in 'Otomatik oturum açma: kapalı', 'LSA parola: False', 'Görev AlamountRPA_Ajan: YOK', 'Görev AlamountRPA_OturumGozetmeni: YOK') {
            if ($d -notmatch [regex]::Escape($m)) { throw "oturum-kaldir sonrası: '$m' yok" }
          }
          net user ci_robot /delete | Out-Null

      - name: Smoke test - Kontrol Merkezi + robot ajanı (iki ayrı kurulum)
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Tesseract' }) -join ';'
          Expand-Archive AlamountRPA_Windows.zip -DestinationPath merkez -Force
          Expand-Archive AlamountRPA_Windows.zip -DestinationPath robot1 -Force
          $m = (Resolve-Path merkez\config.ini).Path
          $r = (Resolve-Path robot1\config.ini).Path
          $c = (Get-Content $m -Raw) -replace '(?m)^port = .*', 'port = 18765'
          $c = $c -replace '(\[MCP\][^\[]*?)aktif = hayir', '$1aktif = evet'
          Set-Content -Encoding utf8 $m $c
          $sifre = ((& merkez\AlamountRPA.exe --config $m merkez-parola admin) -split ': ')[-1].Trim()
          $srv = Start-Process merkez\AlamountRPA.exe -ArgumentList "--config", "`"$m`"", "merkez" -PassThru `
                   -WorkingDirectory merkez -RedirectStandardOutput merkez.out -RedirectStandardError merkez.err
          $ok = $false
          foreach ($i in 1..60) { try { Invoke-RestMethod http://127.0.0.1:18765/api/saglik | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content merkez.out, merkez.err; throw "Kontrol Merkezi başlamadı" }
          # panel girişi
          $s = $null
          Invoke-WebRequest http://127.0.0.1:18765/giris -Method Post -Body @{ad = "admin"; sifre = $sifre} -SessionVariable s -MaximumRedirection 5 | Out-Null
          $pano = Invoke-WebRequest http://127.0.0.1:18765/ -WebSession $s
          if ($pano.Content -notmatch 'Pano') { throw "Panel girişi başarısız" }
          # robot kaydı + ajan
          $key = ((& merkez\AlamountRPA.exe --config $m merkez-robot CI-ROBOT) | Select-String 'robot_anahtari = (.+)').Matches[0].Groups[1].Value
          (Get-Content $r) -replace '^merkez_url =.*', 'merkez_url = http://127.0.0.1:18765' `
                           -replace '^robot_adi =.*', 'robot_adi = CI-ROBOT' `
                           -replace '^robot_anahtari =.*', "robot_anahtari = $key" `
                           -replace '^nabiz_sn = .*', 'nabiz_sn = 5' `
                           -replace '^dosya_bekleme_sn = .*', 'dosya_bekleme_sn = 0' | Set-Content -Encoding utf8 $r
          Copy-Item robot1\ornek_veri\data2.txt robot1\input\
          Copy-Item robot1\ornek_veri\ise_giris\* robot1\input\ise_giris\
          $ajan = Start-Process robot1\AlamountRPA.exe -ArgumentList "--config", "`"$r`"", "ajan" -PassThru `
                    -WorkingDirectory robot1 -RedirectStandardOutput ajan.out -RedirectStandardError ajan.err
          function Is([string[]]$a) { & merkez\AlamountRPA.exe --config $m merkez-is @a; if ($LASTEXITCODE -ne 0) { Get-Content ajan.out -Tail 40; throw "merkez-is $a failed" } }
          try {
            Is pca, --robot, CI-ROBOT, --bekle, 5
            Is ise-giris-dagit, --bekle, 5
            Is ise-giris-isle, --bekle, 10
            Is robot:mikro_personel_giris, --degisken, KURU_CALISMA:evet, --bekle, 5
            Is robot:ornek_masaustu_notepad, --bekle, 5
            $k = Invoke-WebRequest http://127.0.0.1:18765/kuyruklar/ise_giris -WebSession $s
            if (([regex]::Matches($k.Content, 'r-basarili')).Count -lt 2) { throw "Kuyruk öğeleri başarılı değil" }
            $isler = Invoke-WebRequest http://127.0.0.1:18765/isler -WebSession $s
            $rb = Invoke-WebRequest http://127.0.0.1:18765/robotlar -WebSession $s
            if ($rb.Content -notmatch 'Windows oturumu') { throw "Robotlar sayfasında oturum sütunu yok" }
            "Robot Windows oturumu: " + (([regex]::Matches($rb.Content, 'r-oturum_[a-z]+">([^<]+)<') | ForEach-Object { $_.Groups[1].Value }) -join ", ")
            "Panelde $(([regex]::Matches($isler.Content, 'r-basarili')).Count) başarılı iş"
            # MCP — Copilot Studio yolu (X-API-Key, streamable HTTP)
            $mk = (& merkez\AlamountRPA.exe --config $m merkez-mcp-anahtar admin).Trim()
            $h = @{ "X-API-Key" = $mk; "Accept" = "application/json, text/event-stream" }
            $ini = @{ jsonrpc = "2.0"; id = 1; method = "initialize"; params = @{ protocolVersion = "2025-06-18"; capabilities = @{}; clientInfo = @{ name = "ci"; version = "1" } } } | ConvertTo-Json -Depth 5
            $r = Invoke-RestMethod http://127.0.0.1:18765/mcp -Method Post -Headers $h -ContentType "application/json" -Body $ini
            if ($r.result.serverInfo.name -ne "alamount-rpa") { throw "MCP initialize başarısız" }
            $h["MCP-Protocol-Version"] = "2025-06-18"
            $tl = Invoke-RestMethod http://127.0.0.1:18765/mcp -Method Post -Headers $h -ContentType "application/json" -Body '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            if ($tl.result.tools.Count -ne 11) { throw "MCP araç sayısı hatalı: $($tl.result.tools.Count)" }
            $dz = Invoke-RestMethod http://127.0.0.1:18765/mcp -Method Post -Headers $h -ContentType "application/json" -Body '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"durum_ozeti","arguments":{}}}'
            if ($dz.result.content[0].text -notmatch 'CI-ROBOT') { throw "MCP durum_ozeti başarısız" }
            "MCP (HTTP): initialize + $($tl.result.tools.Count) araç + durum_ozeti OK"
            # MCP — Claude Desktop yolu (stdio köprüsü)
            $env:ALAMOUNT_MCP_ANAHTARI = $mk
            $k = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | & robot1\AlamountRPA.exe mcp --merkez http://127.0.0.1:18765/mcp
            if (($k -join "") -notmatch '"alamount-rpa"') { throw "MCP köprüsü başarısız: $k" }
            "MCP (stdio köprüsü): initialize OK"
          } finally {
            Stop-Process -Id $ajan.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
            Get-Content ajan.out -Tail 15
          }

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            smoke/logs/
            smoke/output/*.txt
            smoke/error/
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.3.0-build${{ github.run_number }}
          name: Alamount RPA v3.3.0 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: AlamountRPA_Windows.zip
          body: |
            Alamount RPA – Windows paketi (Kontrol Merkezi + robot ajanı + PCA + OCR + işe giriş + Robot Framework + MCP
            + Citrix/RDP görüntü otomasyonu + e-Fatura/TCMB/MT940 bağlayıcıları + gözetimsiz oturum).
            `AlamountRPA_Windows.zip` dosyasını indirip çıkarın, `KULLANIM.md`'yi okuyun.
            Tesseract OCR (Türkçe dil paketiyle) paketin içindedir; ayrıca kurulum gerekmez.
